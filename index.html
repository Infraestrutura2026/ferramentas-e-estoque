<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Gestão de Ferramentas — Complexo Penal de Marília [Tático]</title>
  <meta name="description" content="Sistema de Gestão de Ferramentas e Estoque da Polícia Penal">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Controles nativos (calendário, selects, scrollbars) no tema claro */
    :root { color-scheme: light; }

    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid #eef2f6; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Menu lateral: hover teal forte + texto/ícone brancos */
    .nav-item:hover {
      background-color: #0d9488 !important;
      color: #fff !important;
      border-color: #0f766e !important;
    }
    .nav-item:hover i { color: #fff !important; }
    .nav-item.is-active {
      background-color: #0f766e !important;
      color: #fff !important;
      border-color: #115e59 !important;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.35);
      font-weight: 700;
    }
    .nav-item.is-active i { color: #fff !important; }

    /* Botões: hover mais visível, sombra e leve elevação */
    button:not(:disabled) {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.14);
    }

    /* Ações padrão (botões, paginação, chips, exportar, cancelar):
       hover teal forte com texto/ícones brancos, sombra e leve elevação */
    .app-button:not(:disabled):hover,
    .pagination-btn:not(:disabled):hover,
    .filter-chip:not(:disabled):hover,
    .export-btn:not(:disabled):hover,
    .cancel-btn:not(:disabled):hover,
    .sidebar-toggle:not(:disabled):hover {
      background-color: #0d9488 !important;
      border-color: #0f766e !important;
      color: #fff !important;
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.35);
      transform: translateY(-1px);
    }
    .app-button:hover i,
    .pagination-btn:hover i,
    .filter-chip:hover i,
    .export-btn:hover i,
    .cancel-btn:hover i,
    .sidebar-toggle:hover i { color: #fff !important; }

    /* Ícones de ação (editar/excluir) como botões com hover preenchido */
    .icon-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border-radius: 0.5rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .icon-action.icon-action-edit:not(:disabled):hover {
      background-color: #0d9488 !important;
      border-color: #0f766e !important;
      color: #fff !important;
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.35);
      transform: translateY(-1px);
    }
    .icon-action.icon-action-danger:not(:disabled):hover {
      background-color: #dc2626 !important;
      border-color: #b91c1c !important;
      color: #fff !important;
      box-shadow: 0 6px 14px rgba(220, 38, 38, 0.35);
      transform: translateY(-1px);
    }
    .icon-action.icon-action-edit:hover i,
    .icon-action.icon-action-danger:hover i { color: #fff !important; }

    /* Ações destrutivas: excluir, sair e devolução continuam vermelhas */
    .btn-danger:not(:disabled):hover {
      background-color: #dc2626 !important;
      border-color: #b91c1c !important;
      color: #fff !important;
      box-shadow: 0 6px 14px rgba(220, 38, 38, 0.35);
      transform: translateY(-1px);
    }
    .btn-danger:hover i { color: #fff !important; }

    /* Tabelas: linha em teal claro com barra lateral */
    tbody tr:hover {
      background-color: #ccfbf1 !important;
      box-shadow: inset 4px 0 0 #0d9488 !important;
    }
    tbody tr:hover > td:first-child {
      box-shadow: inset 4px 0 0 #0d9488 !important;
    }

    /* Cards: borda/sombra teal no hover */
    .bg-white.rounded-xl.border-slate-200:hover {
      border-color: #0d9488 !important;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.18) !important;
    }

    @media print {
      #sidebar, header, #sidebar-overlay, #login-screen, button[onclick*="export"], button[onclick*="print"] { display: none !important; }
      #main-content { padding: 0 !important; }
    }

    /* Fundo do login: cinza-ardósia claro com brilho teal sutil */
    .login-bg {
      background:
        radial-gradient(ellipse 75% 55% at 50% -10%, rgba(13, 148, 136, 0.10) 0%, transparent 60%),
        linear-gradient(160deg, #e2e8f0 0%, #eef2f6 55%, #e8edf3 100%);
    }
  </style>
</head>
<body class="bg-[#eef2f6] text-slate-800 antialiased">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-bg fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card Principal -->
      <div class="bg-white rounded-2xl shadow-xl shadow-slate-300/50 overflow-hidden fade-in border border-slate-200">
        <!-- Header -->
        <div class="bg-white px-8 py-8 text-center relative border-b border-slate-100">
          <div class="absolute top-0 left-0 w-full h-1 bg-teal-600"></div>
          <div class="w-16 h-16 rounded-xl bg-teal-600 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-teal-600/30">
            <i class="fas fa-toolbox text-white text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold text-slate-900">Ferramentas & Estoque</h1>
          <p class="text-xs text-teal-700 uppercase tracking-wider mt-1 font-semibold">Complexo Penal de Marília</p>
          <p class="text-[10px] text-slate-400 mt-1">Polícia Penal — Núcleo de Infraestrutura e Logística</p>
        </div>

        <!-- Formulário -->
        <div class="px-8 py-6 space-y-4 bg-white">
          <div id="login-error" class="hidden bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 text-center"></div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1 tracking-wider">Usuário</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-user" type="text" placeholder="Digite seu usuário"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 bg-slate-50 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:bg-white outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1 tracking-wider">Senha</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input id="login-pass" type="password" placeholder="Digite sua senha"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 bg-slate-50 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:bg-white outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <button id="login-btn" onclick="authModule.doLogin()"
            class="app-button w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg transition shadow-lg shadow-teal-600/20 text-sm uppercase tracking-wide disabled:opacity-60 disabled:cursor-wait">
            <i class="fas fa-sign-in-alt mr-2"></i>Entrar no Sistema
          </button>
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 px-8 py-3 border-t border-slate-200 text-center flex items-center justify-between">
          <p class="text-[10px] text-slate-400">v2.6.0</p>
          <p class="text-[10px] text-slate-400">ZANONI & MARTINEZ InfraTech</p>
        </div>
      </div>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <!-- Scripts (versão ?v= força o navegador a recarregar após mudanças visuais) -->
  <script src="config.js?v=3.0"></script>
  <script src="utils.js?v=3.0"></script>
  <script src="estoque.js?v=3.0"></script>
  <script src="ferramentas.js?v=3.0"></script>
  <script src="indicadores.js?v=3.0"></script>
  <script src="cadastros.js?v=3.0"></script>
  <script src="app.js?v=3.0"></script>
</body>
</html>
