<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Gestão de Ferramentas — Complexo Penal de Marília [Tático]</title>
  <meta name="description" content="Sistema de Gestão de Ferramentas e Estoque da Polícia Penal">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    @media print {
      #sidebar, header, #sidebar-overlay, #login-screen, button[onclick*="export"], button[onclick*="print"] { display: none !important; }
      #main-content { padding: 0 !important; }
    }

    /* Fundo do login: clean — gradiente suave + leve brilho âmbar da marca */
    .login-bg {
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(245, 158, 11, 0.07) 0%, transparent 65%),
        linear-gradient(180deg, #020617 0%, #0f172a 100%);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 antialiased">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-bg fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card Principal -->
      <div class="bg-slate-900 rounded-2xl shadow-2xl overflow-hidden fade-in border border-slate-700/60">
        <!-- Header -->
        <div class="bg-slate-950 px-8 py-8 text-center relative border-b border-slate-800">
          <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
          <div class="w-16 h-16 rounded-xl bg-amber-500 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-500/20">
            <i class="fas fa-toolbox text-slate-950 text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold text-white">Ferramentas & Estoque</h1>
          <p class="text-xs text-amber-300 uppercase tracking-wider mt-1 font-semibold">Complexo Penal de Marília</p>
          <p class="text-[10px] text-slate-400 mt-1">Polícia Penal — Núcleo de Infraestrutura e Logística</p>
        </div>

        <!-- Formulário -->
        <div class="px-8 py-6 space-y-4">
          <div id="login-error" class="hidden bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2 text-sm text-red-300 text-center"></div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1 tracking-wider">Usuário</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input id="login-user" type="text" placeholder="Digite seu usuário"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 bg-slate-950/60 focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1 tracking-wider">Senha</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input id="login-pass" type="password" placeholder="Digite sua senha"
                class="w-full pl-9 pr-3 py-2.5 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 bg-slate-950/60 focus:ring-2 focus:ring-amber-500/60 focus:border-amber-500 outline-none transition"
                onkeydown="if(event.key==='Enter')authModule.doLogin()">
            </div>
          </div>

          <button id="login-btn" onclick="authModule.doLogin()"
            class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition shadow-lg shadow-amber-500/20 text-sm uppercase tracking-wide disabled:opacity-60 disabled:cursor-wait">
            <i class="fas fa-sign-in-alt mr-2"></i>Entrar no Sistema
          </button>
        </div>

        <!-- Footer -->
        <div class="bg-slate-950 px-8 py-3 border-t border-slate-800 text-center flex items-center justify-between">
          <p class="text-[10px] text-slate-500">v2.5.1</p>
          <p class="text-[10px] text-slate-500">ZANONI & MARTINEZ InfraTech</p>
        </div>
      </div>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="estoque.js"></script>
  <script src="ferramentas.js"></script>
  <script src="indicadores.js"></script>
  <script src="cadastros.js"></script>
  <script src="app.js"></script>
</body>
</html>
